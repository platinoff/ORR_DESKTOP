[package]
name = "orr_desktop"
version = "0.1.0"
edition = "2024"
description = "Windows system-tray screen recorder: WGC/GDI capture, OpenH264 encode, MP4 mux — zero external processes"
license = "MIT"
repository = "https://github.com/platinoff/ORR_DESKTOP"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
muda = "0.19.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
openh264 = "0.9"
muxide = "0.2"
tray-icon = "0.24.2"
cpal = "0.18"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp"] }
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
] }
winit = "0.30"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true